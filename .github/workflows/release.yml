name: Release

# Push a tag that matches package.json (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check tag matches package.json
        run: |
          want=$(jq -r .version package.json)
          got="${GITHUB_REF_NAME#v}"
          if [ "$want" != "$got" ]; then
            echo "package.json version ($want) does not match tag ($got)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build single-file binaries
        run: bash scripts/build.sh all

      - name: Smoke test the Linux binary
        run: ./dist/web-linux-x64 --version

      - name: Checksums
        run: |
          cd dist
          sha256sum web-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/web-*
            dist/SHA256SUMS
          generate_release_notes: true
